<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingresar — Sistema Antirobo</title>
<style>
  :root{
    --bg:#f5f5f8;
    --card:#ffffff;
    --card-border:#e9eaef;
    --text:#14161a;
    --muted:#8a8f98;
    --verde:#17a34a;
    --rojo:#dc2626;
    --rojo-bg:#fdecec;
    --shadow:0 1px 2px rgba(15,17,21,.04), 0 8px 20px -12px rgba(15,17,21,.12);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%;
    max-width:350px;
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:26px;
    box-shadow:var(--shadow);
    padding:32px 26px;
  }
  .icono{
    width:56px;height:56px;
    border-radius:50%;
    background:#e7f7ed;
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 16px;
    font-size:25px;
  }
  h1{
    font-size:20px;
    font-weight:800;
    text-align:center;
    margin:0 0 4px;
    letter-spacing:-.2px;
  }
  p.sub{
    text-align:center;
    font-size:13px;
    color:var(--muted);
    margin:0 0 26px;
  }
  label{
    display:block;
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.4px;
    color:var(--muted);
    margin-bottom:7px;
  }
  input{
    width:100%;
    padding:13px 14px;
    border-radius:13px;
    border:1.5px solid var(--card-border);
    font-size:14px;
    margin-bottom:16px;
    background:var(--bg);
    color:var(--text);
    transition:border-color .15s;
  }
  input:focus{outline:none;border-color:var(--verde)}
  button{
    width:100%;
    padding:14px;
    border-radius:15px;
    border:none;
    background:var(--text);
    color:#fff;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    transition:transform .1s, opacity .1s;
  }
  button:active{transform:scale(.98)}
  button:disabled{opacity:.6;cursor:default}
  .error{
    background:var(--rojo-bg);
    color:var(--rojo);
    font-size:13px;
    font-weight:600;
    padding:11px 13px;
    border-radius:12px;
    margin-bottom:16px;
    display:none;
  }
</style>
</head>
<body>

<div class="card">
  <div class="icono">🛡️</div>
  <h1>Sistema Antirobo</h1>
  <p class="sub">Ingresá para ver el estado en vivo</p>

  <div class="error" id="error"></div>

  <form id="formLogin">
    <label for="usuario">Usuario</label>
    <input type="text" id="usuario" name="usuario" autocomplete="username" required>

    <label for="password">Contraseña</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>

    <button type="submit" id="btnEntrar">Ingresar</button>
  </form>
</div>

<script>
const form = document.getElementById('formLogin');
const error = document.getElementById('error');
const btn = document.getElementById('btnEntrar');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  error.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Ingresando...';

  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        usuario: document.getElementById('usuario').value.trim(),
        password: document.getElementById('password').value
      })
    });
    const d = await r.json();

    if (d.ok) {
      window.location.href = '/';
    } else {
      error.textContent = d.error || 'No se pudo iniciar sesión.';
      error.style.display = 'block';
    }
  } catch (err) {
    error.textContent = 'No se pudo conectar con el servidor.';
    error.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Ingresar';
  }
});
</script>

</body>
</html>
