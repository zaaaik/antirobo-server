<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema Antirobo</title>
<style>
  :root{
    --bg:#f5f5f8;
    --card:#ffffff;
    --card-border:#e9eaef;
    --text:#14161a;
    --muted:#8a8f98;
    --verde:#17a34a;
    --verde-bg:#e7f7ed;
    --verde-icon:#cdedd9;
    --rojo:#dc2626;
    --rojo-bg:#fdecec;
    --rojo-icon:#f8cfcf;
    --azul:#2f6fed;
    --azul-bg:#eaf1ff;
    --azul-icon:#d3e2ff;
    --naranja:#e8830f;
    --naranja-bg:#fdf1e2;
    --naranja-icon:#fbe1bb;
    --track:#eef0f3;
    --r-lg:22px;
    --r-md:16px;
    --r-sm:11px;
    --shadow:0 1px 2px rgba(15,17,21,.04), 0 8px 20px -12px rgba(15,17,21,.12);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    width:100%;
    max-width:420px;
    min-height:100vh;
    padding:22px 18px 96px;
    position:relative;
  }
  .tab[hidden]{display:none}

  /* ---------- top bar ---------- */
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
  }
  .topbar-label{font-size:12.5px;color:var(--muted);letter-spacing:.2px}
  .topbar-name{font-size:21px;font-weight:800;margin-top:2px;letter-spacing:-.2px}
  .gear{
    width:38px;height:38px;
    border-radius:13px;
    background:var(--card);
    border:1px solid var(--card-border);
    box-shadow:var(--shadow);
    display:flex;align-items:center;justify-content:center;
    font-size:16px;
    color:var(--muted);
    cursor:pointer;
    transition:transform .15s, background .15s;
  }
  .gear:active{transform:scale(.92); background:var(--track)}

  /* ---------- status card ---------- */
  .status-card{
    border-radius:26px;
    padding:30px 20px;
    text-align:center;
    background:var(--verde-bg);
    transition:background .3s;
    margin-bottom:16px;
    border:1px solid rgba(23,163,74,.12);
  }
  .status-card.alarma{background:var(--rojo-bg); border-color:rgba(220,38,38,.14)}
  .status-icon{
    width:56px;height:56px;
    border-radius:50%;
    background:var(--verde-icon);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 12px;
    font-size:25px;
  }
  .status-card.alarma .status-icon{background:var(--rojo-icon)}
  .status-title{font-size:22px;font-weight:800;color:var(--verde);letter-spacing:-.2px}
  .status-card.alarma .status-title{color:var(--rojo)}
  .status-sub{font-size:13px;color:var(--muted);margin-top:6px}

  /* ---------- location ---------- */
  .location-row{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:var(--r-md);
    padding:13px 15px;
    font-size:13.5px;
    color:var(--text);
    box-shadow:var(--shadow);
    margin-bottom:20px;
  }
  .location-row .pin{font-size:15px}

  /* ---------- sensors ---------- */
  .section-label{
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.6px;
    color:var(--muted);
    margin:0 2px 12px;
  }
  .sensor-card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:var(--r-md);
    padding:15px 16px 14px;
    box-shadow:var(--shadow);
    margin-bottom:11px;
  }
  .sensor-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
  }
  .sensor-name{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:14px;
    font-weight:600;
  }
  .sensor-icon{
    font-size:15px;
    width:30px;height:30px;
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .sensor-icon.azul{background:var(--azul-bg)}
  .sensor-icon.naranja{background:var(--naranja-bg)}
  .sensor-icon.amarillo{background:#fdf6de}
  .sensor-badge{
    font-size:12px;
    font-weight:700;
    color:var(--muted);
  }
  .bar-track{
    height:7px;
    border-radius:5px;
    background:var(--track);
    overflow:hidden;
  }
  .bar-fill{
    height:100%;
    width:0%;
    background:var(--verde);
    border-radius:5px;
    transition:width .4s, background .3s;
  }
  .bar-fill.roja{background:var(--rojo)}

  /* ---------- alert detail ---------- */
  .alert-detail{margin-top:8px}
  .detail-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--card);
    border:1.5px solid var(--card-border);
    border-radius:var(--r-md);
    padding:14px 15px;
    margin-bottom:10px;
    font-size:14px;
    font-weight:600;
    transition:border-color .2s, background .2s;
  }
  .detail-item.activo{
    border-color:var(--rojo);
    background:#fff6f6;
  }
  .detail-name{display:flex;align-items:center;gap:9px}
  .detail-value{
    font-size:12px;
    font-weight:700;
    padding:5px 10px;
    border-radius:9px;
    background:var(--track);
    color:var(--muted);
  }
  .detail-item.activo .detail-value{
    background:var(--rojo-bg);
    color:var(--rojo);
  }

  .action-row{
    display:flex;
    gap:10px;
    margin-top:8px;
  }
  .btn{
    flex:1;
    padding:14px;
    border-radius:var(--r-md);
    border:1.5px solid var(--card-border);
    background:var(--card);
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    color:var(--text);
    transition:transform .1s, opacity .1s;
  }
  .btn:active{transform:scale(.97); opacity:.85}
  .btn-danger{
    border-color:var(--rojo);
    color:var(--rojo);
  }
  .btn:disabled{opacity:.5;cursor:default}

  .pie{
    text-align:center;
    font-size:11.5px;
    color:var(--muted);
    margin-top:16px;
  }

  /* ---------- historial ---------- */
  .historial-item{
    background:var(--card);
    border-radius:var(--r-md);
    box-shadow:var(--shadow);
    padding:14px 16px;
    margin-bottom:11px;
    border-left:3px solid var(--rojo);
  }
  .historial-item .h-titulo{font-weight:700;font-size:14px;color:var(--rojo);display:flex;align-items:center;gap:6px}
  .historial-item .h-detalle{color:var(--muted);font-size:12px;margin-top:4px}
  .historial-item img{width:100%;border-radius:12px;margin-top:10px;display:block}

  /* ---------- cámara ---------- */
  .camara-frame{
    background:#000;
    border-radius:var(--r-lg);
    overflow:hidden;
    box-shadow:var(--shadow);
    border:1px solid var(--card-border);
    min-height:280px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .camara-frame video{width:100%;display:block}
  .camara-frame .pie{color:#d7d9de; margin:0; padding:0 24px}
  .camara-estado{
    text-align:center;
    font-size:12.5px;
    color:var(--muted);
    margin-top:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
  }
  .punto-vivo{width:8px;height:8px;border-radius:50%;background:var(--muted)}
  .punto-vivo.on{background:var(--rojo)}

  /* ---------- bottom nav ---------- */
  .bottomnav{
    position:fixed;
    left:0;right:0;bottom:0;
    display:flex;
    justify-content:center;
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(10px);
    border-top:1px solid var(--card-border);
    padding:9px 10px calc(9px + env(safe-area-inset-bottom));
  }
  .bottomnav-inner{
    width:100%;
    max-width:420px;
    display:flex;
    justify-content:space-around;
    gap:4px;
  }
  .nav-btn{
    background:none;
    border:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    font-size:10.5px;
    font-weight:600;
    color:var(--muted);
    padding:6px 14px;
    border-radius:14px;
    cursor:pointer;
    transition:background .15s, color .15s;
  }
  .nav-btn span{font-size:10.5px}
  .nav-btn .ico{font-size:19px}
  .nav-btn.active{color:var(--text); background:var(--track)}
  .nav-btn:disabled{opacity:.35;cursor:default}
</style>
</head>
<body>

<div class="app">

  <div class="topbar">
    <div>
      <div class="topbar-label">Dispositivo</div>
      <div class="topbar-name">Nodo 01</div>
    </div>
    <div class="gear" id="btnSalir" title="Cerrar sesión">🚪</div>
  </div>

  <!-- ==================== TAB: INICIO ==================== -->
  <div class="tab" id="tabInicio">

    <div class="status-card" id="statusCard">
      <div class="status-icon" id="statusIcon">🛡️</div>
      <div class="status-title" id="statusTitle">Cargando...</div>
      <div class="status-sub" id="statusSub">-</div>
    </div>

    <div class="location-row">
      <span class="pin">📍</span>
      <span id="locationText">Bodega trasera — puerta norte</span>
    </div>

    <div class="section-label">Sensores en vivo</div>

    <div class="sensor-card">
      <div class="sensor-row">
        <div class="sensor-name"><span class="sensor-icon azul">🔊</span>Sonido</div>
        <div class="sensor-badge" id="sonidoBadge">- dB</div>
      </div>
      <div class="bar-track"><div class="bar-fill" id="barraSonido"></div></div>
    </div>

    <div class="sensor-card">
      <div class="sensor-row">
        <div class="sensor-name"><span class="sensor-icon naranja">🏃</span>Movimiento</div>
        <div class="sensor-badge" id="movBadge">Sin detección</div>
      </div>
      <div class="bar-track"><div class="bar-fill" id="barraMov"></div></div>
    </div>

    <div class="sensor-card">
      <div class="sensor-row">
        <div class="sensor-name"><span class="sensor-icon amarillo">💡</span>Luz</div>
        <div class="sensor-badge" id="luzBadge">- lux</div>
      </div>
      <div class="bar-track"><div class="bar-fill" id="barraLuz"></div></div>
    </div>

    <!-- Detalle de alerta: solo visible cuando hay alarma -->
    <div class="alert-detail" id="alertDetail" hidden>
      <div class="section-label">Qué se activó</div>

      <div class="detail-item" id="detSonido">
        <div class="detail-name">🔊 Sonido</div>
        <div class="detail-value" id="detSonidoValor">-</div>
      </div>
      <div class="detail-item" id="detMov">
        <div class="detail-name">🏃 Movimiento</div>
        <div class="detail-value" id="detMovValor">-</div>
      </div>
      <div class="detail-item" id="detLuz">
        <div class="detail-name">💡 Luz</div>
        <div class="detail-value" id="detLuzValor">-</div>
      </div>

      <div class="action-row">
        <button class="btn" id="btnSilenciar">Silenciar</button>
        <button class="btn btn-danger" id="btnCamara">Ver cámara</button>
      </div>
    </div>

    <div class="pie" id="pie">-</div>
  </div>

  <!-- ==================== TAB: HISTORIAL ==================== -->
  <div class="tab" id="tabHistorial" hidden>
    <div class="section-label">Historial · Alertas totales <b id="alertasTotal">0</b></div>
    <div id="historial"><div class="pie">Sin alertas registradas.</div></div>
  </div>

  <!-- ==================== TAB: CÁMARA ==================== -->
  <div class="tab" id="tabCamara" hidden>
    <div class="section-label">Cámara en vivo</div>

    <div class="camara-frame">
      <video id="videoCamara" autoplay playsinline muted hidden></video>
      <div id="camaraSinFoto" class="pie">Conectando con la cámara...</div>
    </div>

    <div class="camara-estado">
      <div class="punto-vivo" id="camaraPunto"></div>
      <span id="camaraFecha">-</span>
    </div>
  </div>

</div>

<div class="bottomnav">
  <div class="bottomnav-inner">
    <button class="nav-btn active" id="navInicio" data-tab="tabInicio"><span class="ico">🏠</span><span>Inicio</span></button>
    <button class="nav-btn" id="navHistorial" data-tab="tabHistorial"><span class="ico">🕐</span><span>Historial</span></button>
    <button class="nav-btn" id="navCamara" data-tab="tabCamara"><span class="ico">📷</span><span>Cámara</span></button>
    <button class="nav-btn" id="navNotif" disabled><span class="ico">🔔</span><span>Alertas</span></button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
/* ---------------- Config / escalas de visualización ----------------
   "sonido" y "luz" son lecturas analógicas crudas del Arduino (0–1023),
   no dB/lux reales — se etiquetan así solo por estética visual.
   SONIDO_UMBRAL debe coincidir con UMBRAL_SONIDO en arduino/antirobo.ino;
   si cambiás uno, cambiá el otro. */
const SONIDO_MAX = 1023;     // escala de la barra de sonido (rango del ADC)
const SONIDO_UMBRAL = 410;   // debe coincidir con UMBRAL_SONIDO del Arduino
const LUZ_MAX = 1023;        // escala de la barra de luz (rango del ADC)

/* "Movimiento" se calcula con el HC-SR04 (sensor de distancia): si algo
   corta el haz y queda más cerca que DISTANCIA_UMBRAL, se considera
   "Detectado". DISTANCIA_RANGO solo se usa para dibujar la barra
   (más cerca = barra más llena). Ajustá estos valores según dónde
   quede montado el sensor. */
const DISTANCIA_UMBRAL = 50; // cm — por debajo de esto, se marca "Detectado"
const DISTANCIA_RANGO = 200; // cm — rango visual de la barra

let alarmaAnterior = false;
let alarmaInicio = null;     // Date en que empezó la alarma actual
let ultimaActDate = null;    // Date de la última actualización recibida
let silenciado = false;      // true si el usuario apretó "Silenciar" en esta alerta
let ctxGlobal = null;
let beepInterval = null;

/* Desbloquea el audio en el primer toque/clic del usuario (los
   navegadores no permiten reproducir sonido sin interacción previa). */
function desbloquearAudio() {
  if (ctxGlobal) return;
  try { ctxGlobal = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
}
document.addEventListener('click', desbloquearAudio, { once: true });
document.addEventListener('touchstart', desbloquearAudio, { once: true });

function pitar() {
  if (!ctxGlobal) return;
  try {
    const osc = ctxGlobal.createOscillator();
    const gain = ctxGlobal.createGain();
    osc.connect(gain);
    gain.connect(ctxGlobal.destination);
    osc.type = 'square';
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.15, ctxGlobal.currentTime);
    osc.start();
    osc.stop(ctxGlobal.currentTime + 0.6);
  } catch (e) {}
}

function iniciarBeepRepetido() {
  detenerBeepRepetido();
  pitar();
  beepInterval = setInterval(pitar, 1200);
}
function detenerBeepRepetido() {
  if (beepInterval) { clearInterval(beepInterval); beepInterval = null; }
}

document.getElementById('btnSilenciar').addEventListener('click', () => {
  silenciado = true;
  detenerBeepRepetido();
});

/* ---------------- Cámara: video en vivo por WebRTC ---------------- */
const videoCamara = document.getElementById('videoCamara');
const camaraSinFoto = document.getElementById('camaraSinFoto');
const camaraFecha = document.getElementById('camaraFecha');
const camaraPunto = document.getElementById('camaraPunto');
const ICE_SERVERS = [{ urls: 'stun:stun.l.google.com:19302' }];

let socketCamara = null;
let pcCamara = null;

function conectarCamara() {
  camaraSinFoto.hidden = false;
  camaraSinFoto.textContent = 'Conectando con la cámara...';
  videoCamara.hidden = true;
  camaraFecha.textContent = 'Conectando...';
  camaraPunto.classList.remove('on');

  socketCamara = io();

  socketCamara.on('connect', () => socketCamara.emit('quiero-ver'));

  socketCamara.on('connect_error', () => {
    camaraSinFoto.textContent = 'Sesión vencida — volvé a entrar.';
    camaraFecha.textContent = '-';
  });

  socketCamara.on('camara-desconectada', () => {
    camaraSinFoto.hidden = false;
    camaraSinFoto.textContent = 'El teléfono-cámara no está conectado ahora mismo.';
    videoCamara.hidden = true;
    camaraFecha.textContent = 'Sin señal';
    camaraPunto.classList.remove('on');
  });

  socketCamara.on('oferta', async ({ offer }) => {
    pcCamara = new RTCPeerConnection({ iceServers: ICE_SERVERS });

    pcCamara.ontrack = (e) => {
      videoCamara.srcObject = e.streams[0];
      videoCamara.hidden = false;
      camaraSinFoto.hidden = true;
      camaraFecha.textContent = 'En vivo';
      camaraPunto.classList.add('on');
    };
    pcCamara.onicecandidate = (e) => {
      if (e.candidate) socketCamara.emit('ice-candidato', { candidate: e.candidate });
    };
    pcCamara.onconnectionstatechange = () => {
      if (['disconnected', 'failed', 'closed'].includes(pcCamara.connectionState)) {
        camaraSinFoto.hidden = false;
        camaraSinFoto.textContent = 'Se cortó la conexión con la cámara.';
        videoCamara.hidden = true;
        camaraFecha.textContent = 'Sin señal';
        camaraPunto.classList.remove('on');
      }
    };

    await pcCamara.setRemoteDescription(offer);
    const answer = await pcCamara.createAnswer();
    await pcCamara.setLocalDescription(answer);
    socketCamara.emit('respuesta', { answer });
  });

  socketCamara.on('ice-candidato', ({ candidate }) => {
    if (pcCamara) pcCamara.addIceCandidate(candidate).catch(() => {});
  });
}

function desconectarCamara() {
  if (pcCamara) { pcCamara.close(); pcCamara = null; }
  if (socketCamara) { socketCamara.disconnect(); socketCamara = null; }
  videoCamara.srcObject = null;
  camaraPunto.classList.remove('on');
}

document.getElementById('btnCamara').addEventListener('click', () => mostrarTab('tabCamara'));

document.getElementById('btnSalir').addEventListener('click', async () => {
  try { await fetch('/api/logout', { method: 'POST' }); } catch (e) {}
  window.location.href = '/login.html';
});

/* ---------------- Navegación inferior ---------------- */
function mostrarTab(id) {
  document.querySelectorAll('.tab').forEach(t => t.hidden = (t.id !== id));
  document.getElementById('navInicio').classList.toggle('active', id === 'tabInicio');
  document.getElementById('navHistorial').classList.toggle('active', id === 'tabHistorial');
  document.getElementById('navCamara').classList.toggle('active', id === 'tabCamara');

  if (id === 'tabCamara') {
    conectarCamara();
  } else {
    desconectarCamara();
  }
}
document.getElementById('navInicio').addEventListener('click', () => mostrarTab('tabInicio'));
document.getElementById('navHistorial').addEventListener('click', () => mostrarTab('tabHistorial'));
document.getElementById('navCamara').addEventListener('click', () => mostrarTab('tabCamara'));

/* ---------------- Utilidades de tiempo ---------------- */
function segundosDesde(fecha) {
  if (!fecha) return 0;
  return Math.max(0, Math.round((Date.now() - fecha.getTime()) / 1000));
}

/* Refresca los textos "hace N s" cada segundo, sin esperar al próximo fetch */
function tickTiempos() {
  const sub = document.getElementById('statusSub');
  if (alarmaAnterior && alarmaInicio) {
    sub.textContent = alarmaInicio.toLocaleTimeString() + ' · hace ' + segundosDesde(alarmaInicio) + ' s';
  } else if (!alarmaAnterior && ultimaActDate) {
    sub.textContent = 'Sin novedades · hace ' + segundosDesde(ultimaActDate) + ' s';
  }
}
setInterval(tickTiempos, 1000);

/* ---------------- Fetch de datos ---------------- */
async function actualizar() {
  try {
    const r = await fetch('/api/datos');
    if (r.status === 401) {
      window.location.href = '/login.html';
      return;
    }
    const d = await r.json();

    ultimaActDate = d.ultimaActualizacion ? new Date(d.ultimaActualizacion) : new Date();

    // Movimiento real, a partir de la distancia del HC-SR04.
    // Cuando el sensor no recibe eco (timeout), el Arduino envía 999 cm
    // ("muy lejos"), así que nunca dispara este umbral por error.
    const movimientoDetectado = d.distancia > 0 && d.distancia < DISTANCIA_UMBRAL;

    // --- Badges y barras ---
    document.getElementById('sonidoBadge').textContent = d.sonido + ' dB';
    document.getElementById('luzBadge').textContent = d.luz + ' lux';
    document.getElementById('movBadge').textContent = movimientoDetectado ? 'Detectado' : 'Sin detección';

    const pctSonido = Math.min(100, (d.sonido / SONIDO_MAX) * 100);
    const pctLuz = Math.min(100, (d.luz / LUZ_MAX) * 100);
    const pctMov = d.distancia > 0 ? Math.min(100, Math.max(0, 100 - (d.distancia / DISTANCIA_RANGO) * 100)) : 0;

    const sonidoActivo = d.sonido > SONIDO_UMBRAL;

    // El umbral de luz se calibra en el Arduino al arrancar y llega en
    // d.luzUmbral (ver arduino/antirobo.ino). Si todavía no llegó ningún
    // dato con ese campo (firmware viejo), no marcamos Luz como activada.
    const luzActiva = d.luzUmbral != null && d.luz > d.luzUmbral;

    const barraSonido = document.getElementById('barraSonido');
    const barraLuz = document.getElementById('barraLuz');
    const barraMov = document.getElementById('barraMov');

    barraSonido.style.width = pctSonido + '%';
    barraLuz.style.width = pctLuz + '%';
    barraMov.style.width = pctMov + '%';

    barraSonido.classList.toggle('roja', sonidoActivo);
    barraMov.classList.toggle('roja', movimientoDetectado);
    barraLuz.classList.toggle('roja', luzActiva);

    // --- Card de estado ---
    const card = document.getElementById('statusCard');
    const icon = document.getElementById('statusIcon');
    const titulo = document.getElementById('statusTitle');
    const alertDetail = document.getElementById('alertDetail');

    if (d.alarma) {
      if (!alarmaAnterior) {
        // Nueva alerta: arranca el contador y el sonido
        alarmaInicio = ultimaActDate;
        silenciado = false;
        iniciarBeepRepetido();
      }
      card.classList.add('alarma');
      icon.textContent = '⚠️';
      titulo.textContent = 'Alerta de intrusión';
      alertDetail.hidden = false;

      // Detalle de qué se activó
      document.getElementById('detSonidoValor').textContent = d.sonido + ' dB · umbral ' + SONIDO_UMBRAL;
      document.getElementById('detMovValor').textContent = d.distancia + ' cm · umbral ' + DISTANCIA_UMBRAL;
      document.getElementById('detLuzValor').textContent = d.luzUmbral != null
        ? d.luz + ' lux · umbral ' + d.luzUmbral
        : d.luz + ' lux · normal';

      document.getElementById('detSonido').classList.toggle('activo', sonidoActivo);
      document.getElementById('detMov').classList.toggle('activo', movimientoDetectado);
      document.getElementById('detLuz').classList.toggle('activo', luzActiva);

    } else {
      card.classList.remove('alarma');
      icon.textContent = '🛡️';
      titulo.textContent = 'Vigilando';
      alertDetail.hidden = true;
      alarmaInicio = null;
      detenerBeepRepetido();
    }

    alarmaAnterior = d.alarma;
    tickTiempos();

    // --- Historial ---
    document.getElementById('alertasTotal').textContent = d.alertas;
    const hist = document.getElementById('historial');
    if (d.eventos && d.eventos.length > 0) {
      hist.innerHTML = d.eventos.slice(0, 10).map(ev => `
        <div class="historial-item">
          <div class="h-titulo">🚨 Intrusión detectada</div>
          <div class="h-detalle">${new Date(ev.fecha).toLocaleString()} — sonido: ${ev.sonido} dB · luz: ${ev.luz} lux</div>
          ${ev.foto ? `<img src="${ev.foto}">` : ''}
        </div>
      `).join('');
    }

    document.getElementById('pie').textContent = 'Última actualización: ' + ultimaActDate.toLocaleTimeString();

  } catch (err) {
    document.getElementById('statusTitle').textContent = 'Sin conexión';
    document.getElementById('statusSub').textContent = 'Revisa el servidor';
  }
}

actualizar();
setInterval(actualizar, 2000);
</script>

</body>
</html>
