<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cámara — Sistema Antirobo</title>
<style>
  :root{
    --bg:#0f1115;
    --card:#1a1d24;
    --text:#f3f4f7;
    --muted:#8a8f98;
    --verde:#1fa855;
    --rojo:#e4423f;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px 16px;
  }
  h1{font-size:16px;margin:0 0 4px}
  p.sub{font-size:13px;color:var(--muted);margin:0 0 18px;text-align:center}
  video{
    width:100%;
    max-width:420px;
    border-radius:16px;
    background:#000;
  }
  .estado{
    margin-top:16px;
    padding:10px 16px;
    border-radius:12px;
    background:var(--card);
    font-size:13px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .punto{
    width:9px;height:9px;
    border-radius:50%;
    background:var(--muted);
  }
  .punto.transmitiendo{background:var(--rojo)}
  .punto.espera{background:var(--verde)}
  .error{
    margin-top:16px;
    color:var(--rojo);
    font-size:13px;
    text-align:center;
    max-width:340px;
  }
</style>
</head>
<body>

<h1>📷 Cámara del sistema antirobo</h1>
<p class="sub">Dejá esta pantalla y el teléfono encendidos y apuntando al área a vigilar.</p>

<video id="video" autoplay playsinline muted></video>

<div class="estado">
  <div class="punto" id="punto"></div>
  <span id="textoEstado">Iniciando cámara...</span>
</div>

<div class="error" id="error" hidden></div>

<canvas id="canvas" hidden></canvas>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const punto = document.getElementById('punto');
const textoEstado = document.getElementById('textoEstado');
const errorDiv = document.getElementById('error');

const INTERVALO_CHEQUEO = 700;  // cada cuánto pregunta si "vale la pena" transmitir
const ANCHO_FOTO = 400;         // resolución reducida para que las fotos sean livianas y rápidas

async function iniciarCamara() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } },
      audio: false
    });
    video.srcObject = stream;
    textoEstado.textContent = 'En espera...';
    punto.className = 'punto espera';

    // Evita que la pantalla se apague mientras esta página esté abierta (si el navegador lo soporta).
    if ('wakeLock' in navigator) {
      try { await navigator.wakeLock.request('screen'); } catch (e) {}
    }

    cicloEnvio();
  } catch (err) {
    errorDiv.hidden = false;
    errorDiv.textContent = 'No se pudo acceder a la cámara: ' + err.message +
      '. Revisá que le hayas dado permiso de cámara a esta página.';
    textoEstado.textContent = 'Sin cámara';
  }
}

function capturarFrame() {
  const w = ANCHO_FOTO;
  const h = Math.round(video.videoHeight * (w / video.videoWidth)) || w;
  canvas.width = w;
  canvas.height = h;
  canvas.getContext('2d').drawImage(video, 0, 0, w, h);
  return canvas.toDataURL('image/jpeg', 0.4);
}

async function enviarFoto() {
  try {
    const foto = capturarFrame();
    await fetch('/api/camara/foto', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ foto })
    });
  } catch (e) {
    // Falla de red puntual: no pasa nada, se reintenta en el próximo ciclo.
  }
}

async function cicloEnvio() {
  try {
    const r = await fetch('/api/camara/activo');
    if (r.status === 401) {
      textoEstado.textContent = 'Sesión vencida — volvé a entrar';
      punto.className = 'punto';
      window.location.href = '/login.html';
      return;
    }
    const d = await r.json();

    if (d.activo) {
      textoEstado.textContent = 'Transmitiendo...';
      punto.className = 'punto transmitiendo';
      await enviarFoto();
    } else {
      textoEstado.textContent = 'En espera...';
      punto.className = 'punto espera';
    }
  } catch (e) {
    textoEstado.textContent = 'Sin conexión con el servidor...';
    punto.className = 'punto';
  }

  setTimeout(cicloEnvio, INTERVALO_CHEQUEO);
}

iniciarCamara();
</script>

</body>
</html>
