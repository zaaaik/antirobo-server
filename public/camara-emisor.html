<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cámara — Sistema Antirobo</title>
<style>
  :root{
    --bg:#0f1115;
    --card:#1a1d24;
    --text:#f3f4f7;
    --muted:#8a8f98;
    --verde:#1fa855;
    --rojo:#e4423f;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px 16px;
  }
  h1{font-size:16px;margin:0 0 4px}
  p.sub{font-size:13px;color:var(--muted);margin:0 0 18px;text-align:center}
  video{
    width:100%;
    max-width:420px;
    border-radius:16px;
    background:#000;
  }
  .estado{
    margin-top:16px;
    padding:10px 16px;
    border-radius:12px;
    background:var(--card);
    font-size:13px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .punto{
    width:9px;height:9px;
    border-radius:50%;
    background:var(--muted);
  }
  .punto.transmitiendo{background:var(--rojo)}
  .punto.espera{background:var(--verde)}
  .error{
    margin-top:16px;
    color:var(--rojo);
    font-size:13px;
    text-align:center;
    max-width:340px;
  }
  canvas{display:none}
</style>
</head>
<body>

<h1>📷 Cámara del sistema antirobo</h1>
<p class="sub">Dejá esta pantalla y el teléfono encendidos y apuntando al área a vigilar.</p>

<video id="video" autoplay playsinline muted></video>

<div class="estado">
  <div class="punto" id="punto"></div>
  <span id="textoEstado">Iniciando cámara...</span>
</div>

<div class="error" id="error" hidden></div>

<canvas id="canvas"></canvas>

<script src="/socket.io/socket.io.js"></script>
<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const punto = document.getElementById('punto');
const textoEstado = document.getElementById('textoEstado');
const errorDiv = document.getElementById('error');

const ICE_SERVERS = [{ urls: 'stun:stun.l.google.com:19302' }];
const ANCHO_FOTO = 480; // resolución de la foto que se guarda cuando salta una alarma

let stream = null;
let socket = null;
const peers = {}; // viewerId -> RTCPeerConnection
let viewersConectados = 0;

function actualizarEstadoUI() {
  if (viewersConectados > 0) {
    textoEstado.textContent = 'Transmitiendo (' + viewersConectados + ' viendo)';
    punto.className = 'punto transmitiendo';
  } else {
    textoEstado.textContent = 'En espera...';
    punto.className = 'punto espera';
  }
}

async function iniciarCamara() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } },
      audio: false
    });
    video.srcObject = stream;
    actualizarEstadoUI();

    // Evita que la pantalla se apague mientras esta página esté abierta (si el navegador lo soporta).
    if ('wakeLock' in navigator) {
      try { await navigator.wakeLock.request('screen'); } catch (e) {}
    }

    conectarSenializacion();
    vigilarAlarma();
  } catch (err) {
    errorDiv.hidden = false;
    errorDiv.textContent = 'No se pudo acceder a la cámara: ' + err.message +
      '. Revisá que le hayas dado permiso de cámara a esta página.';
    textoEstado.textContent = 'Sin cámara';
  }
}

/* ---------------- WebRTC: esta pantalla es la que transmite ---------------- */
function conectarSenializacion() {
  socket = io();

  socket.on('connect', () => socket.emit('soy-camara'));

  socket.on('connect_error', () => {
    textoEstado.textContent = 'Sesión vencida — volvé a entrar';
    punto.className = 'punto';
    window.location.href = '/login.html';
  });

  // Llegó un nuevo espectador: le armamos una conexión y le mandamos una oferta.
  socket.on('nuevo-viewer', async ({ viewerId }) => {
    const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    peers[viewerId] = pc;

    stream.getTracks().forEach(track => pc.addTrack(track, stream));

    pc.onicecandidate = (e) => {
      if (e.candidate) socket.emit('ice-candidato', { viewerId, candidate: e.candidate });
    };
    pc.onconnectionstatechange = () => {
      if (pc.connectionState === 'connected') {
        viewersConectados++;
        actualizarEstadoUI();
      } else if (['disconnected', 'failed', 'closed'].includes(pc.connectionState)) {
        cerrarPeer(viewerId);
      }
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    socket.emit('oferta', { viewerId, offer });
  });

  socket.on('respuesta', async ({ answer, viewerId }) => {
    const pc = peers[viewerId];
    if (pc) await pc.setRemoteDescription(answer);
  });

  socket.on('ice-candidato', ({ candidate, viewerId }) => {
    const pc = peers[viewerId];
    if (pc) pc.addIceCandidate(candidate).catch(() => {});
  });

  socket.on('viewer-desconectado', ({ viewerId }) => cerrarPeer(viewerId));
}

function cerrarPeer(viewerId) {
  const pc = peers[viewerId];
  if (!pc) return;
  const estabaConectado = pc.connectionState === 'connected';
  pc.close();
  delete peers[viewerId];
  if (estabaConectado) viewersConectados = Math.max(0, viewersConectados - 1);
  actualizarEstadoUI();
}

/* ---------------- Foto automática cuando salta una alarma (para el historial) ---------------- */
let ultimaAlarmaFotografiada = false;

function capturarFrame() {
  const w = ANCHO_FOTO;
  const h = Math.round(video.videoHeight * (w / video.videoWidth)) || w;
  canvas.width = w;
  canvas.height = h;
  canvas.getContext('2d').drawImage(video, 0, 0, w, h);
  return canvas.toDataURL('image/jpeg', 0.6);
}

async function vigilarAlarma() {
  try {
    const r = await fetch('/api/datos');
    if (r.ok) {
      const d = await r.json();
      if (d.alarma && !ultimaAlarmaFotografiada) {
        ultimaAlarmaFotografiada = true;
        fetch('/api/camara/foto', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ foto: capturarFrame() })
        }).catch(() => {});
      } else if (!d.alarma) {
        ultimaAlarmaFotografiada = false;
      }
    }
  } catch (e) {}

  setTimeout(vigilarAlarma, 3000);
}

iniciarCamara();
</script>

</body>
</html>
