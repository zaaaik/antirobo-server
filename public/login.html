<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingresar — Sistema Antirobo</title>
<style>
  :root{
    --bg:#f3f4f7;
    --card:#ffffff;
    --card-border:#eceef1;
    --text:#1c1e21;
    --muted:#8a8f98;
    --rojo:#e4423f;
    --rojo-bg:#fbe6e6;
    --shadow:0 1px 3px rgba(20,20,20,.04), 0 1px 2px rgba(20,20,20,.03);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .card{
    width:100%;
    max-width:340px;
    background:var(--card);
    border-radius:20px;
    box-shadow:var(--shadow);
    padding:28px 24px;
  }
  .icono{
    width:48px;height:48px;
    border-radius:50%;
    background:#e3f6ea;
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 14px;
    font-size:22px;
  }
  h1{
    font-size:19px;
    text-align:center;
    margin:0 0 4px;
  }
  p.sub{
    text-align:center;
    font-size:13px;
    color:var(--muted);
    margin:0 0 22px;
  }
  label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin-bottom:6px;
  }
  input{
    width:100%;
    padding:12px 13px;
    border-radius:12px;
    border:1.5px solid var(--card-border);
    font-size:14px;
    margin-bottom:14px;
    background:var(--bg);
    color:var(--text);
  }
  input:focus{outline:none;border-color:#1c1e21}
  button{
    width:100%;
    padding:13px;
    border-radius:14px;
    border:none;
    background:var(--text);
    color:#fff;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
  }
  button:disabled{opacity:.6;cursor:default}
  .error{
    background:var(--rojo-bg);
    color:var(--rojo);
    font-size:13px;
    padding:10px 12px;
    border-radius:10px;
    margin-bottom:14px;
    display:none;
  }
</style>
</head>
<body>

<div class="card">
  <div class="icono">🛡️</div>
  <h1>Sistema Antirobo</h1>
  <p class="sub">Ingresá para ver el estado en vivo</p>

  <div class="error" id="error"></div>

  <form id="formLogin">
    <label for="usuario">Usuario</label>
    <input type="text" id="usuario" name="usuario" autocomplete="username" required>

    <label for="password">Contraseña</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>

    <button type="submit" id="btnEntrar">Ingresar</button>
  </form>
</div>

<script>
const form = document.getElementById('formLogin');
const error = document.getElementById('error');
const btn = document.getElementById('btnEntrar');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  error.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Ingresando...';

  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        usuario: document.getElementById('usuario').value.trim(),
        password: document.getElementById('password').value
      })
    });
    const d = await r.json();

    if (d.ok) {
      window.location.href = '/';
    } else {
      error.textContent = d.error || 'No se pudo iniciar sesión.';
      error.style.display = 'block';
    }
  } catch (err) {
    error.textContent = 'No se pudo conectar con el servidor.';
    error.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Ingresar';
  }
});
</script>

</body>
</html>
